<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>相撲餘票監看</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎫</text></svg>">
<style>
:root {
  --bg: #f6f4ef;
  --card: #ffffff;
  --ink: #1d1b18;
  --muted: #6d675e;
  --line: #e4dfd5;
  --ok: #1f7a4d;
  --ok-bg: #e3f3ea;
  --warn: #9a5b00;
  --warn-bg: #fdf0d8;
  --bad: #b3261e;
  --bad-bg: #fbe4e1;
  --hit: #b3261e;
  --hit-bg: #fff1c2;
  --chip-off: #efebe3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --card: #211f1c;
    --ink: #f1ede6;
    --muted: #a49d92;
    --line: #36322c;
    --ok: #6fd3a0;
    --ok-bg: #173226;
    --warn: #f3b75c;
    --warn-bg: #3a2b12;
    --bad: #ff8a80;
    --bad-bg: #3d1c19;
    --hit: #ffd166;
    --hit-bg: #3d3214;
    --chip-off: #2c2925;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --card: #211f1c; --ink: #f1ede6; --muted: #a49d92; --line: #36322c;
  --ok: #6fd3a0; --ok-bg: #173226; --warn: #f3b75c; --warn-bg: #3a2b12;
  --bad: #ff8a80; --bad-bg: #3d1c19; --hit: #ffd166; --hit-bg: #3d3214; --chip-off: #2c2925;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: .02em; }
header p { margin: 0 0 16px; color: var(--muted); font-size: .9rem; }
.banner {
  border-radius: 14px; padding: 16px 18px; margin-bottom: 16px;
  border: 1px solid transparent;
}
.banner h2 { margin: 0 0 4px; font-size: 1.2rem; }
.banner p { margin: 0; }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner.hit { background: var(--hit-bg); color: var(--ink); border-color: var(--hit); }
.banner.hit h2 { color: var(--hit); font-size: 1.4rem; }
.banner ul { margin: 8px 0 0; padding-left: 1.2em; }
.banner a { color: inherit; font-weight: 600; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; margin-bottom: 14px;
}
.card h3 { margin: 0; font-size: 1.02rem; }
.card .meta { color: var(--muted); font-size: .84rem; margin: 2px 0 10px; }
.card .meta a { color: var(--muted); }
.note { font-size: .84rem; padding: 6px 10px; border-radius: 8px; margin-bottom: 10px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--bad-bg); color: var(--bad); }
.group { padding: 10px 0; border-top: 1px solid var(--line); }
.group:first-of-type { border-top: 0; }
.group-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .95rem; }
.group-head span { color: var(--muted); font-weight: 400; font-size: .8rem; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip {
  font-size: .82rem; padding: 3px 10px; border-radius: 999px;
  background: var(--chip-off); color: var(--muted);
}
.chip.on { background: var(--hit-bg); color: var(--hit); font-weight: 700; outline: 1px solid var(--hit); }
.events { list-style: none; margin: 0; padding: 0; font-size: .88rem; }
.events li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.events li:first-child { border-top: 0; }
.events time { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
footer { color: var(--muted); font-size: .8rem; margin-top: 18px; }
footer a { color: var(--muted); }
.empty { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>福岡九州場所 餘票監看</h1>
    <p id="scope">讀取中…</p>
  </header>
  <section id="banner" class="banner warn"><h2>讀取中…</h2></section>
  <section id="sources"></section>
  <section class="card">
    <h3>最近事件</h3>
    <ul id="events" class="events"></ul>
  </section>
  <footer>
    <p id="fetched"></p>
    <p>這個頁面每 60 秒自動更新。監看程式在電腦上執行，每分鐘把最新狀態上傳一次；超過 5 分鐘沒有更新，代表電腦或監看可能停了。</p>
  </footer>
</main>
<script>
const OWNER = "kiplinaa2200260-maker", REPO = "sumo-watch", BRANCH = "status";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/status.json?ref=${BRANCH}`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/status.json`;
const STALE_MS = 5 * 60 * 1000;
let data = null, lastFetch = null, fetchError = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "—";
function ago(iso) {
  if (!iso) return "—";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.floor(s / 60)} 分鐘前`;
  if (s < 86400) return `${Math.floor(s / 3600)} 小時 ${Math.floor(s % 3600 / 60)} 分鐘前`;
  return `${Math.floor(s / 86400)} 天前`;
}

async function load() {
  try {
    let r = await fetch(API, { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-cache" });
    if (!r.ok) r = await fetch(`${RAW}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    fetchError = null;
  } catch (e) {
    fetchError = e.message;
  }
  lastFetch = new Date().toISOString();
  render();
}

function renderBanner() {
  const el = document.getElementById("banner");
  if (!data) {
    el.className = "banner bad";
    el.innerHTML = `<h2>讀不到監看資料</h2><p>${esc(fetchError || "")}，稍後會自動重試。</p>`;
    return;
  }
  const age = Date.now() - new Date(data.updated_at);
  const stale = age > STALE_MS;
  const hits = data.available || [];
  if (hits.length) {
    el.className = "banner hit";
    const links = [...new Map(hits.map(h => [h.url, h.source])).entries()]
      .map(([url, src]) => `<a href="${esc(url)}" target="_blank" rel="noopener">前往購買：${esc(src)}</a>`).join("<br>");
    el.innerHTML = `<h2>🎫 有票了！</h2><ul>${hits.map(h => `<li>${esc(h.source)}：${esc(h.text)}</li>`).join("")}</ul>
      <p style="margin-top:10px">${links}</p><p style="margin-top:8px;font-size:.85rem">偵測時間 ${fmt(data.updated_at)}（${ago(data.updated_at)}）</p>`;
    document.title = "🎫 有票了！相撲餘票監看";
    return;
  }
  document.title = "相撲餘票監看";
  if (data.state === "stopped") {
    el.className = "banner bad";
    el.innerHTML = `<h2>⛔ 監看已停止</h2><p>${esc(data.message || "")}</p><p style="font-size:.85rem">停止於 ${fmt(data.updated_at)}（${ago(data.updated_at)}）</p>`;
  } else if (stale) {
    el.className = "banner warn";
    el.innerHTML = `<h2>⚠️ 監看可能已停止</h2><p>最後更新是 ${ago(data.updated_at)}（${fmt(data.updated_at)}）。電腦可能重新開機、關機、睡眠，或 Claude 對話被關掉了。</p>`;
  } else {
    el.className = "banner ok";
    el.innerHTML = `<h2>✅ 監看中，目前沒有票</h2><p>最後更新 ${ago(data.updated_at)}</p>`;
  }
}

function renderSources() {
  const box = document.getElementById("sources");
  if (!data) { box.innerHTML = ""; return; }
  box.innerHTML = (data.sources || []).map(s => {
    const note = s.state === "maintenance" ? `<div class="note warn">🛠 ${esc(s.note)}</div>`
      : s.state === "error" ? `<div class="note bad">❗ ${esc(s.note)}</div>` : "";
    const groups = (s.groups || []).map(g => `
      <div class="group">
        <div class="group-head">${esc(g.label)}<span>${g.checked_at ? "檢查於 " + ago(g.checked_at) : ""}</span></div>
        <div class="chips">${g.items.map(i => `<span class="chip${i.available ? " on" : ""}">${esc(i.name)}　${esc(i.status)}</span>`).join("")}</div>
      </div>`).join("") || `<p class="empty">還沒有資料</p>`;
    return `<article class="card">
      <h3>${esc(s.title)}</h3>
      <p class="meta">${esc(s.freq || "")}・上一分鐘查了 ${s.checks_per_min ?? 0} 次・<a href="${esc(s.url)}" target="_blank" rel="noopener">開啟購買頁</a></p>
      ${note}${groups}
    </article>`;
  }).join("");
}

function render() {
  if (data) {
    document.getElementById("scope").textContent = `${(data.targets || []).join("、")}・${data.seat || "椅子席"}・監看啟動於 ${fmt(data.started_at)}`;
    document.getElementById("events").innerHTML = (data.events || []).map(e =>
      `<li><time>${fmt(e.time)}</time><span>${esc(e.text)}</span></li>`).join("") || `<li class="empty">沒有事件</li>`;
  }
  renderBanner();
  renderSources();
  document.getElementById("fetched").textContent = `頁面上次抓取：${fmt(lastFetch)}${fetchError ? `（失敗：${fetchError}）` : ""}`;
}

load();
setInterval(load, 60 * 1000);
setInterval(render, 10 * 1000);
</script>
</body>
</html>
